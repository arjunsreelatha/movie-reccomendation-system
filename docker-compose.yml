services:
  recommendation-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

volumes:
  huggingface-cache:
